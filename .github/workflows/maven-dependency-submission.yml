name: "Maven Dependency Submission"
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  submit-dependencies:
    if: github.repository == 'bhoradc/aws-sdk-java-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: advanced-security/maven-dependency-submission-action@v5
        with:
          maven-args: >-
            -DtransitiveExcludes=*:*
            -DclasspathScope=runtime
            -pl !build-tools,!release-scripts,!archetypes,!test/test-utils,!test/sdk-benchmarks,!test/http-client-tests,!test/http-client-benchmarks,!test/s3-benchmarks,!test/protocol-tests-core,!test/ruleset-testing-core,!test/protocol-tests,!test/service-test-utils,!test/codegen-generated-classes-test,!test/sdk-standard-benchmarks,!test/module-path-tests,!test/tests-coverage-reporting,!test/stability-tests,!test/sdk-native-image-test,!test/auth-tests,!test/region-testing,!test/old-client-version-compatibility-test,!test/bundle-logging-bridge-binding-test,!test/v2-migration-tests,!test/bundle-shading-tests,!test/crt-unavailable-tests,!test/architecture-tests,!test/s3-tests

  notify-alerts:
    if: github.repository == 'bhoradc/aws-sdk-java-v2'
    needs: submit-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for alert processing
        run: sleep 60
      - name: Check and notify actionable alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          ONE_DAY_AGO=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)

          # Fetch open alerts using the PAT
          ALERTS=$(gh api repos/${{ github.repository }}/dependabot/alerts?state=open\&per_page=100 2>&1)
          if [ $? -ne 0 ]; then
            echo "Failed to fetch alerts: $ALERTS"
            exit 1
          fi

          # Filter and format
          MESSAGE=$(echo "$ALERTS" | jq -r --arg cutoff "$ONE_DAY_AGO" '
            [.[] | select(.created_at > $cutoff and .security_vulnerability.first_patched_version != null)]
            | group_by((.security_advisory.cve_id // .security_advisory.ghsa_id) + "|" + .security_vulnerability.package.name)
            | map({
                cve: .[0].security_advisory.cve_id // .[0].security_advisory.ghsa_id,
                pkg: .[0].security_vulnerability.package.name,
                severity: (.[0].security_advisory.severity | ascii_upcase),
                fix: .[0].security_vulnerability.first_patched_version.identifier,
                count: length,
                url: .[0].html_url
              })
            | if length == 0 then empty
              else
                "\(length) new Dependabot security alert(s) with fixes available:\n\n" +
                (map("• \(.cve) (\(.severity)) - \(.pkg) -> upgrade to \(.fix) [\(.count) module(s)]") | join("\n")) +
                "\n\nAction needed: Upgrade the affected dependencies."
              end
          ')

          if [ -z "$MESSAGE" ]; then
            echo "No new actionable alerts in the last 24 hours."
            exit 0
          fi

          echo "Sending Slack notification..."
          echo "$MESSAGE"

          # Escape for JSON
          ESCAPED=$(echo "$MESSAGE" | jq -Rs .)

          curl -s -X POST "$SLACK_WEBHOOK_URL"             -H 'Content-Type: application/json'             -d "{\"text\": $ESCAPED}"

          echo "Slack notification sent."
